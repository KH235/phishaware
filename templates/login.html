
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PhishAware</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #090b10;
            color: #e9eaf0;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            background: #13151e;
            border: 1px solid #363044;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }

        .brand {
            color: #39f5a5;
            font-size: 27px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #a6a6b5;
            text-align: center;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #0c0e15;
            color: white;
            border: 1px solid #444052;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #39f5a5;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: #39f5a5;
            color: #07120e;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #6affbe;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #bd91ff;
            text-decoration: none;
            font-size: 14px;
        }

        .error {
            padding: 12px;
            background: rgba(255, 80, 80, .1);
            border: 1px solid #ff6464;
            color: #ff9292;
            border-radius: 8px;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand">◈ PhishAware</div>
        <p class="subtitle">
            SECURITY CONSOLE // USER AUTHENTICATION
        </p>

        <h2>Sign In</h2>

        {% if error %}
        <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                maxlength="50"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <!-- CSRF token will be added when CSRF protection is configured -->

            <button type="submit">ACCESS CONSOLE</button>
        </form>

        <a class="back" href="{{ url_for('home') }}">
            ← Back to PhishAware
        </a>
    </main>
</body>
</html>
