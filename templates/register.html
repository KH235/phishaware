
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | PhishAware</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #090b10;
            color: #e7eaf0;
            font-family: Consolas, "Courier New", monospace;
        }

        .register-card {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            background: #11151d;
            border: 1px solid #273344;
            border-radius: 14px;
            box-shadow: 0 0 35px rgba(0, 255, 136, 0.06);
        }

        .logo {
            text-align: center;
            color: #00ff88;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #929cab;
            font-size: 13px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 21px;
            margin: 0 0 24px;
            text-align: center;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #bac4d0;
            font-size: 13px;
        }

        input {
            display: block;
            width: 100%;
            padding: 12px 13px;
            background: #090d13;
            color: #ffffff;
            border: 1px solid #344253;
            border-radius: 7px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 0 2px rgba(0, 255, 136, 0.12);
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            margin-top: 26px;
            background: #00ff88;
            color: #07100c;
            border: none;
            border-radius: 7px;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-btn:hover {
            background: #55ffad;
            box-shadow: 0 0 18px rgba(0, 255, 136, 0.3);
        }

        .error {
            padding: 12px;
            margin-bottom: 18px;
            background: rgba(255, 70, 90, 0.1);
            border: 1px solid #ff465a;
            border-radius: 7px;
            color: #ff8997;
            font-size: 13px;
        }

        .footer-links {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: #9aa4b3;
            line-height: 2;
        }

        a {
            color: #c59bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .password-hint {
            margin-top: 6px;
            font-size: 11px;
            color: #8995a5;
        }
    </style>
</head>

<body>

    <main class="register-card">

        <div class="logo">⬡ PHISHAWARE</div>
        <div class="subtitle">COMMUNITY THREAT INTELLIGENCE PLATFORM</div>

        <h1>Create Your Account</h1>

        {% if error %}
        <div class="error" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}">

            <!-- Required for Flask-WTF CSRF protection -->
            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <label for="username">Username</label>
            <input type="text"
                   id="username"
                   name="username"
                   maxlength="50"
                   autocomplete="username"
                   value="{{ request.form.get('username', '') }}"
                   required>

            <label for="email">Email Address</label>
            <input type="email"
                   id="email"
                   name="email"
                   maxlength="255"
                   autocomplete="email"
                   value="{{ request.form.get('email', '') }}"
                   required>

            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   minlength="8"
                   autocomplete="new-password"
                   required>

            <div class="password-hint">
                Minimum 8 characters
            </div>

            <label for="confirm_password">Confirm Password</label>
            <input type="password"
                   id="confirm_password"
                   name="confirm_password"
                   minlength="8"
                   autocomplete="new-password"
                   required>

            <button type="submit" class="submit-btn">
                ✚ Create Account
            </button>

        </form>

        <div class="footer-links">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>

            <div>
                <a href="{{ url_for('home') }}">← Back to Dashboard</a>
            </div>
        </div>

    </main>

</body>
</html>
